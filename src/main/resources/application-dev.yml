# Development profile. NEVER use these secrets or settings outside a local machine.
spring:
  datasource:
    password: authserver

server:
  servlet:
    session:
      cookie:
        secure: false                    # dev runs on plain http

logging:
  level:
    org.springframework.security: DEBUG

authserver:
  signing:
    allow-ephemeral: true
  bootstrap:
    enabled: true
    clients:
      - client-id: demo-service          # a calling service: gets tokens via client_credentials
        secret: demo-service-secret
        scopes: [demo.read]
      - client-id: demo-api              # an application API: authenticates to /oauth2/introspect
        secret: demo-api-secret
        scopes: []
      - client-id: platform-admin        # calls /admin/apps and /admin/resource-servers (onboarding)
        secret: platform-admin-secret
        scopes: [auth.admin]

  # Dev-only: key the built-in demo directory (/dev/demo-directory) expects from the auth server.
  secrets:
    demo-dir: dev-key
